<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f7f2" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Barakah — your spiritual practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="rewards.css" />
  <link rel="stylesheet" href="spiritual.css" />
</head>
<body>
  <div id="auth-root" class="auth-root"></div>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Barakah home"><span class="brand-mark">✳</span><span>barakah<span class="brand-period">.</span></span></a>
      <p class="nav-label">YOUR JOURNEY</p>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="today"><span class="nav-icon">⌂</span>Home</button>
        <button class="nav-item" data-view="quran"><span class="nav-icon">۞</span>Qur’an</button>
        <button class="nav-item" data-view="habits"><span class="nav-icon">☷</span>Habits</button>
        <button class="nav-item" data-view="rewards"><span class="nav-icon">✦</span>Rewards</button>
        <button class="nav-item" data-view="profile"><span class="nav-icon">◉</span>Profile</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="quote-card"><span class="quote-icon">✦</span><p>“The most beloved deeds to Allah are those that are most consistent, even if they are small.”</p><span class="quote-source">— Prophet Muhammad ﷺ</span></div>
        <div class="profile"><div class="avatar">S</div><div><strong>My journey</strong><span>A little better, every day</span></div><button class="more-button" aria-label="Profile options">···</button></div>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="breadcrumb">YOUR SPACE <span>/</span> <strong id="section-title">MY DAY</strong></div><div class="top-actions"><span class="date-chip" id="top-date"></span><button class="icon-button" id="today-button" aria-label="Go to today" title="Go to today">⌂</button></div></header>
      <div id="view-container"></div>
    </main>
  </div>
  <dialog id="habit-dialog" class="habit-dialog">
    <form id="habit-form" method="dialog">
      <div class="dialog-heading"><div><span class="eyebrow">MAKE IT YOURS</span><h2 id="dialog-title">Create a habit</h2></div><button type="button" class="close-button" id="close-dialog" aria-label="Close">×</button></div>
      <label class="field-label" for="habit-name">Habit name</label><input id="habit-name" class="text-input" maxlength="42" placeholder="e.g. Read Qur’an" required />
      <label class="field-label" for="habit-category">Category</label><select id="habit-category" class="text-input"><option value="Prayer">Prayer</option><option value="Qur’an">Qur’an</option><option value="Dhikr">Dhikr</option><option value="Character">Character</option><option value="Learning">Learning</option><option value="Wellbeing">Wellbeing</option><option value="Giving">Giving</option></select>
      <label class="field-label" for="habit-goal">Daily intention <span class="optional">optional</span></label><input id="habit-goal" class="text-input" maxlength="48" placeholder="e.g. 5 prayers · 10 minutes" />
      <label class="field-label" for="habit-icon">Choose an icon</label><div class="icon-choices" id="icon-choices"></div>
      <div class="dialog-actions"><button type="button" class="button secondary" id="cancel-dialog">Cancel</button><button class="button primary" id="save-habit">Save habit <span>↗</span></button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="rewards.js"></script>
  <script src="spiritual.js"></script>
  <script src="auth.js"></script>
</body>
</html>
